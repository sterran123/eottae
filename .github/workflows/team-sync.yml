# 「어때?」 팀 동기화 스케줄러 — 팀원 활동 점검 + 문서 자동 갱신
#
# 주기: 매주 월요일 09:00 KST (cron은 UTC 기준 → 월 00:00 UTC) + 수동 실행
#   - 머지마다 돌지 않는다 — 머지마다 봇 PR이 생겨 승인할 일만 늘었다(4일에 10건). 매니페스트는 제출 때만 최신이면 된다
#   - 제출 직전·리포트가 바로 필요할 때: Actions 탭 → "Run workflow" (집계 기간 입력 가능)
#   - 매일 점검으로 바꾸려면 cron을 '0 0 * * *' 로 수정
#   - 시각·진행 상태만 바뀐 리포트는 다시 쓰지 않는다(tools/team_activity_report.mjs) → 바뀐 게 없으면 PR도 없다
#
# 하는 일:
#   1) main 건강검사 — npm ci → typecheck → build (실패 시 작업 중단, 리포트 없음)
#   2) 팀원별 커밋·PR·요구사항 ID·CI 상태를 모아 docs/TEAM_ACTIVITY.md 갱신
#   3) FILE_INDEX.csv / MANIFEST.sha256 재생성 (리포트의 최신 해시가 들어가도록 순서 고정)
#   4) 변경분을 auto/team-sync 브랜치로 push → PR 자동 생성/갱신
#      (pr-review 봇이 생성 파일만인지·빌드 통과를 판정 — 봇은 자기 PR을 승인할 수 없어 승인 1번 필요)
name: team-sync

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: "활동 집계 기간(일)"
        required: false
        default: "7"

permissions:
  contents: write
  pull-requests: write
  statuses: write
  # 리포트의 main/PR CI 상태는 check-runs API를 읽는다 — 이 권한이 없으면
  # 스케줄 실행에서 403 → 리포트가 항상 '기록 없음'으로 나온다
  checks: read

concurrency:
  group: team-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      REPORT_DAYS: ${{ github.event.inputs.days || '7' }}
    steps:
      # dispatch를 다른 브랜치에서 실행해도 건강검사·auto/team-sync 기준은 항상 main
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "0. 소스코드/eottae-web/package-lock.json"

      - name: main 건강검사 (ci.yml과 동일 절차)
        working-directory: "0. 소스코드/eottae-web"
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: 팀 활동 리포트 생성
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/team_activity_report.mjs

      # 리포트 생성 후에 재생성해야 TEAM_ACTIVITY.md의 최신 해시가 매니페스트에 들어간다
      - name: 제출 매니페스트 재생성
        run: python3 tools/update_package_manifest.py

      - name: 변경분을 auto/team-sync 브랜치 PR로 반영
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B auto/team-sync
          git add "0. 소스코드/eottae-web/docs/TEAM_ACTIVITY.md" FILE_INDEX.csv MANIFEST.sha256

          if git diff --cached --quiet; then
            echo "갱신할 변경 없음 — PR 생성 건너뜀"
            # 열린 봇 PR이 있으면 main보다 낡은 내용이다(최신으로 만든 결과가 main과 같으므로) — 닫는다.
            # 그대로 두면 충돌 안내("다음 실행이 덮어씀")와 달리 영영 남는다
            OLD_PR=$(gh pr list --head auto/team-sync --json number -q '.[0].number' || true)
            if [ -n "$OLD_PR" ]; then
              gh pr close "$OLD_PR" --delete-branch \
                --comment "최신 main 기준으로 다시 만든 리포트·매니페스트가 main과 같아 이 PR은 필요 없어졌습니다 — team-sync가 자동으로 닫습니다." || true
            fi
            exit 0
          fi

          git commit -m "chore(team-sync): 팀 활동 리포트·매니페스트 자동 갱신 ($(date +%F))"
          git push -f origin auto/team-sync

          # GITHUB_TOKEN이 연 PR은 워크플로를 다시 트리거하지 못해 CI check가 안 돈다.
          # 이 잡에서 동일 검증(npm ci→typecheck→build)을 통과했으므로
          # 필수 상태 'check'를 런 링크와 함께 직접 기록한다.
          SHA=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=success -f context=check \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="team-sync 잡에서 npm ci→typecheck→build 통과" || true

          PR_URL=$(gh pr list --head auto/team-sync --json url -q '.[0].url' || true)
          if [ -z "$PR_URL" ]; then
          cat > /tmp/team-sync-pr-body.md <<'EOF'
          ## 자동 생성 PR (team-sync 스케줄러)

          - `docs/TEAM_ACTIVITY.md`: 팀원별 커밋·PR·요구사항 ID·CI 상태 집계
          - `FILE_INDEX.csv` / `MANIFEST.sha256`: 제출 패키지 해시 재생성
          - 건강검사: 이 워크플로 잡에서 `npm ci → typecheck → build` 통과

          pr-review 봇이 자동 생성 파일만 바뀌었는지와 빌드 결과를 판정합니다.
          EOF
          gh pr create --base main --head auto/team-sync \
            --title "🤖 팀 활동 리포트·매니페스트 자동 갱신 ($(date +%F))" \
            --body-file /tmp/team-sync-pr-body.md
          else
            echo "기존 PR 유지: $PR_URL"
          fi
