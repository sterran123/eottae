# 「어때?」 CI — 모든 push/PR에서 타입체크+빌드를 강제 검증한다.
# 앱 소스는 "0. 소스코드/eottae-web" 하위에 있다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "0. 소스코드/eottae-web"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "0. 소스코드/eottae-web/package-lock.json"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
