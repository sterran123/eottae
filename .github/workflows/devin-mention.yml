name: devin-mention

# pull_request_review_comment 트리거는 두지 않는다 — 그 이벤트는 워크플로 파일까지 PR 머지 ref 버전으로 실행해
# PR이 바꾼 YAML·스크립트가 Devin 키를 받는다. (브릿지는 PR의 소유자 호출을 어차피 Devin 자체 처리에 넘긴다)
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: devin-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bridge:
    # Devin 세션은 호출마다 크레딧을 쓴다 — 저장소 소유자만 부를 수 있다.
    # 저장소 변수 AI_REVIEW_ENGINE=grok-local이면 꺼진다 — 대신 `@grok`(tools/grok_mention.mjs, 로컬 작업자)
    if: >-
      vars.AI_REVIEW_ENGINE != 'grok-local' &&
      contains(github.event.comment.body, '@devin') &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 브릿지 스크립트는 항상 main 기준 — PR이 바꾼 브릿지가 Devin 키로 실행되지 않게
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Devin mention bridge
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/devin_mention_bridge.mjs
