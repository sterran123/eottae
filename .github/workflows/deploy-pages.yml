# 「어때?」 GitHub Pages 배포 — main push 때마다 정적 export를 Pages에 배포
#
# 전제: 저장소 Settings → Pages → Source = "GitHub Actions" (한 번만 설정)
# 결과: https://sterran123.github.io/eottae/
#
# next.config.mjs가 output:'export' + basePath:'/eottae'라서
# `npm run build` 한 번이면 out/ 아래에 배포 가능한 정적 파일이 나온다.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "0. 소스코드/eottae-web"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "0. 소스코드/eottae-web/package-lock.json"

      - uses: actions/configure-pages@v5

      # ci.yml과 동일 절차로 검증 후 export 산출물 생성
      - run: npm ci
      - run: npm run typecheck
      # ADR-005 — Supabase 공개 값(URL·Publishable key)만 빌드에 주입한다. service_role은 절대 넣지 않는다.
      # Secrets가 비어 있으면 빈 문자열로 빌드되고 화면은 데모 데이터 모드로 동작한다.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "0. 소스코드/eottae-web/out"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
